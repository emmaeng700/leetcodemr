      for (var i = 0; i < line.length; i++) {
        var c = line[i]
        if (c === '[' || c === '(' || c === '{') depth++
        else if (c === ']' || c === ')' || c === '}') depth--
        if (depth === 0 && c === ',') {
          var rest = line.slice(i + 1).replace(/^\s+/, '')
          if (/^\w+\s*=/.test(rest)) {
            pushStmt(cur)
            cur = ''
            continue
          }
        }
        cur += c
      }
      pushStmt(cur)
      return stmts
    }

    function normalizeExampleText(s) {
      return String(s || '')
        .replace(/[−–—]/g, '-')
        .replace(/\u00a0/g, ' ')
        .replace(/\bnull\b/gi, 'None')
        .replace(/\btrue\b/gi, 'True')
        .replace(/\bfalse\b/gi, 'False')
        // [1,#,2,3,#,...] → [1,"#",2,3,"#",...] (next-pointer level-order for #116/#117)
        .replace(/([\[,])\s*#(?=\s*[,\]])/g, '$1"#"')
    }

    function inputToPython(inputStr) {
      var s = normalizeExampleText(inputStr).replace(/=\s*\n\s*/g, '= ')
      var lines = s.split('\n').map(function(l) { return l.trim() }).filter(Boolean)
      var result = []
      lines.forEach(function(line) {
        // Strip trailing explanation tails like "→ ..." already handled by parse.
        line = line.replace(/\s*→.*$/, '').replace(/\s*->.*$/, '')
        splitInputAssignments(line).forEach(function(stmt) { result.push(stmt) })
      })
      return result.join('\n')
    }

    function applyInputAliases(inputPy, params) {
      var lines = inputPy.split('\n')
      var paramSet = {}
      params.forEach(function(p) { paramSet[p] = true; paramSet[p.toLowerCase()] = true })
      var out = []
      lines.forEach(function(line) {
        var m = line.match(/^([A-Za-z_]\w*)\s*=/)
        if (!m) { out.push(line); return }
        var name = m[1]
        if (paramSet[name] || paramSet[name.toLowerCase()]) { out.push(line); return }
        var alias = INPUT_ALIASES[name.toLowerCase()]
        if (alias && (paramSet[alias] || paramSet[alias.toLowerCase()])) {
          out.push(alias + line.slice(name.length))
          return
        }
        out.push(line)
      })
      // adjList → node for graph
      if (paramSet.node && !/\bnode\s*=/.test(out.join('\n')) && /\badjList\s*=/.test(out.join('\n'))) {
        out.push('node = adjList')
      }
      return out.join('\n')
    }

    function getQuestionDescription(q) {
      var row = descriptions[String(q.id)] || {}
      return String(row.description || q.description || '')
    }

    function parseExamples(q) {
      if (q && q.examples && q.examples.length) return q.examples
      var desc = getQuestionDescription(q)
      var examples = []
      function cleanOutput(output) {
        var o = normalizeExampleText(String(output || '')).trim()
        if (!o) return o
        // Full bracket value (nested lists like [[0,4],[1,3],...]) — not first "]".
        if (o[0] === '[') {
          var g = matchBracketGroup(o, 0)
          if (g) return g.text
        }
        if (o[0] === '{') {
          var depth = 0
          for (var j = 0; j < o.length; j++) {
            if (o[j] === '{') depth++
            else if (o[j] === '}') {
              depth--
              if (depth === 0) return o.slice(0, j + 1)
            }
          }
        }
        var m = o.match(/^(True|False|None|null|true|false|-?\d+(?:\.\d+)?(?:e-?\d+)?)/)
        if (m) return m[1]
        // Inline prose after a value: "3. Explanation..."
        var cut = o.split(/\.\s+/)[0].trim()
        return cut || o.split('\n')[0].trim()
      }
      function extractOutputBlock(block) {
        var om = block.match(/Output\s*:?\s*\n?([\s\S]*)/i)
        if (!om) return null
        var raw = om[1]
        // Stop before Explanation / Constraints / next Example when present.
        raw = raw.split(/\n\s*(?:Explanation|Constraints|Example\s+\d+|Note\b)/i)[0]
        return raw.trim()
      }
      function pushEx(input, output) {
        if (!input || output == null || output === '') return
        examples.push({
          input: normalizeExampleText(input).trim(),
          output: cleanOutput(output),
          kind: 'normal'
        })
      }

      // Standard blocks: Example N / Example N:
      var parts = desc.split(/Example\s+\d+\s*:?/i)
      for (var i = 1; i < parts.length; i++) {
        var block = parts[i]
        var inputM = block.match(/Input\s*:?\s*\n([\s\S]*?)(?=\n\s*Output\s*:?)/i)
        if (!inputM) inputM = block.match(/Input\s*:\s*([^\n]+)/i)
        if (!inputM) inputM = block.match(/Input\s*\n([\s\S]*?)\n\s*\n\s*Output/i)
        var outRaw = extractOutputBlock(block)
        if (inputM && outRaw) pushEx(inputM[1], outRaw)
      }

      // Inline: Example 1: Input: ... → Output: ...
      if (!examples.length) {
        var reInline = /Example\s+\d+\s*:?\s*Input\s*:\s*([\s\S]*?)\s*(?:→|->|Output\s*:)\s*([\s\S]*?)(?=\.\s+[A-Z]|Example\s+\d+|$)/gi
        var m
        while ((m = reInline.exec(desc))) pushEx(m[1], m[2])
      }

      // Design / class API: ["Ctor","op",...] [[args],...] [outs]
      if (!examples.length) {
        var design = parseDesignExamples(desc)
        if (design.length) return design
      }
      return examples
    }

    function matchBracketGroup(str, from) {
      var i = from
      while (i < str.length && /\s/.test(str[i])) i++
      if (str[i] !== '[') return null
      var depth = 0
      for (var j = i; j < str.length; j++) {
        var ch = str[j]
        if (ch === '[') depth++
        else if (ch === ']') {
          depth--
          if (depth === 0) return { text: str.slice(i, j + 1), end: j + 1 }
        }
      }
      return null
    }

    function parseDesignExamples(desc) {
      var examples = []
      var opsRe = /\[\s*"[A-Za-z_][\w]*"(?:\s*,\s*"[A-Za-z_][\w]*")+\s*\]/g
      var m
      while ((m = opsRe.exec(desc))) {
        var opsLit = m[0]
        var rest = desc.slice(m.index + opsLit.length)
        var argsG = matchBracketGroup(rest, 0)
        if (!argsG) continue
        var expG = matchBracketGroup(rest, argsG.end)
        if (!expG) continue
        examples.push({
          kind: 'design',
          ops: normalizeExampleText(opsLit),
          args: normalizeExampleText(argsG.text),
          output: normalizeExampleText(expG.text)
        })
        if (examples.length >= 3) break
      }
      return examples
    }

    function descriptionAllowsAnyOrder(q) {
      // STAR clarify notes often live in starterPython ("Return in any order? Yes.")
      var d = (
        getQuestionDescription(q) + '\n' +
        ((q && q.starterPython) || '') + '\n' +
        ((q && q.title) || '')
      ).toLowerCase()
      if (/any order\s*\?\s*no\b/.test(d) && !/any order\s*\?\s*yes\b/.test(d)) return false
      return /any order|in any order|return the answer in any order|unordered|return any|any of them|many valid answers|one possible|any valid/.test(d)
    }

    function isCourseOrderQuestion(q, methodName) {
      var blob = ((q && (q.title || '')) + ' ' + (q && (q.slug || '')) + ' ' + (methodName || '')).toLowerCase()
      return methodName === 'findOrder' || /course-schedule-ii|course schedule ii/.test(blob)
    }

    function isNaryQuestion(q, solutionCode) {
      var blob = ((q && (q.title || '')) + ' ' + (q && (q.slug || '')) + ' ' + (solutionCode || '')).toLowerCase()
      if (/\bn-?ary\b/.test(blob)) return true
      if (/\.children\b/.test(solutionCode || '') && !/\.neighbors\b/.test(solutionCode || '')) return true
      return false
    }

    function isGraphQuestion(q, solutionCode) {
      var blob = ((q && (q.title || '')) + ' ' + (q && (q.slug || ''))).toLowerCase()
      if (/clone-graph|clone graph/.test(blob)) return true
      if (/\.neighbors\b/.test(solutionCode || '') && !/\.children\b/.test(solutionCode || '')) return true
      return false
    }

    function findDesignClassName(solutionCode) {
      var names = []
      var re = /class\s+([A-Za-z_]\w*)\s*(?:[:(\n])/g
      var m
      while ((m = re.exec(solutionCode))) {
        if (m[1] !== 'Solution' && m[1] !== 'TreeNode' && m[1] !== 'ListNode' && m[1] !== 'Node' && m[1] !== 'Interval') {
          names.push(m[1])
        }
      }
      return names[0] || null
    }

    function isCodecQuestion(solutionCode) {
      return /def\s+serialize\s*\(/.test(solutionCode) && /def\s+deserialize\s*\(/.test(solutionCode)
    }

    function extractMethodParams(solutionCode) {
      // Prefer Solution method; else first non-init method.
      var solutionClassIdx = solutionCode.indexOf('class Solution')
      var searchIn = solutionClassIdx >= 0 ? solutionCode.slice(solutionClassIdx) : solutionCode
      var methodMatch = searchIn.match(/def\s+(\w+)\s*\(self/)
      var methodName = methodMatch ? methodMatch[1] : 'solve'
      if (methodName === '__init__') {
        var alt = searchIn.match(/def\s+(?!__init__)(\w+)\s*\(self/)
        if (alt) methodName = alt[1]
      }
      var paramMatch = searchIn.match(new RegExp('def\\s+' + methodName + '\\s*\\(self(?:,\\s*([^)]+))?\\)'))
      if (!paramMatch) paramMatch = searchIn.match(/def\s+\w+\s*\(self(?:,\s*([^)]+))?\)/)
      var params = []
      if (paramMatch && paramMatch[1]) {
        params = paramMatch[1].split(',').map(function(p) {
          return p.trim().split(/[=:\s]/)[0].trim()
        }).filter(function(p) { return p && !/^Optional|List|Dict|Tuple|Set/.test(p) })
      }
      return { methodName: methodName, params: params }
    }

    function buildDesignHarness(solutionCode, examples) {
      var className = findDesignClassName(solutionCode)
      if (!className) return null
      var caseParts = examples.map(function(ex) {
        var exp = normalizeExampleText(ex.output)
        var expEsc = exp.replace(/\\/g, '\\\\').replace(/'/g, "\\'")
        return (
          'try:\n' +
          '    _ops = ' + ex.ops + '\n' +
          '    _args = ' + ex.args + '\n' +
          '    _exp = ' + exp + '\n' +
          '    _got = []\n' +
          '    _obj = None\n' +
          '    for _i, _op in enumerate(_ops):\n' +
          '        if _i == 0:\n' +
          '            _obj = ' + className + '(*(_args[_i] if _i < len(_args) else []))\n' +
          '            _got.append(None)\n' +
          '        else:\n' +
          '            _fn = getattr(_obj, _op)\n' +
          '            _a = _args[_i] if _i < len(_args) else []\n' +
          '            _got.append(_fn(*_a))\n' +
          '    _ok = _ser_cmp(_got, _exp, True)\n' +
          '    # getRandom / pickIndex are nondeterministic — accept if value is among legal outputs when mismatch\n' +
          '    if (not _ok) and any(x in _ops for x in ("getRandom","pickIndex","randPoint")):\n' +
          '        _ok = True\n' +
          '        for _i,_op in enumerate(_ops):\n' +
          '            if _op in ("getRandom","pickIndex","randPoint"): continue\n' +
          '            if _canon(_got[_i]) != _canon(_exp[_i]):\n' +
          '                _ok = False; break\n' +
          '    _results.append({"pass": _ok, "got": str(_canon(_got)), "exp": str(_canon(_exp))})\n' +
          'except Exception as _e:\n' +
          '    _results.append({"pass": False, "error": str(_e), "got": "error", "exp": \'' + expEsc + '\'})'
        )
      })
      return (
        PYTHON_PREAMBLE + '\n' +
        solutionCode + '\n\n' +
        '_results = []\n\n' +
        caseParts.join('\n\n') + '\n\n' +
        'json.dumps(_results)'
      )
    }

    function buildCodecHarness(solutionCode, examples, nary) {
      var className = findDesignClassName(solutionCode) || 'Codec'
      var caseParts = examples.filter(function(ex) { return ex.kind !== 'design' }).map(function(ex) {
        var inputPy = applyInputAliases(inputToPython(ex.input), ['root'])
        var expectedPy = normalizeExampleText(ex.output)
        var expectedEsc = expectedPy.replace(/\\/g, '\\\\').replace(/'/g, "\\'")
        return (
          'try:\n' +
          inputPy.split('\n').map(function(l) { return '    ' + l }).join('\n') + '\n' +
          '    root = _make_tree(root) if isinstance(root, list) else root\n' +
          '    _c = ' + className + '()\n' +
          '    _got = _tree_to_arr(_c.deserialize(_c.serialize(root)))\n' +
          '    _exp = ' + expectedPy + '\n' +
          '    _ok = _ser_cmp(_got, _exp)\n' +
          '    _results.append({"pass": _ok, "got": str(_got), "exp": str(_exp)})\n' +
          'except Exception as _e:\n' +
          '    _results.append({"pass": False, "error": str(_e), "got": "error", "exp": \'' + expectedEsc + '\'})'
        )
      })
      if (!caseParts.length) return null
      return (
        PYTHON_PREAMBLE + '\n' +
        solutionCode + '\n\n' +
        '_results = []\n\n' +
        caseParts.join('\n\n') + '\n\n' +
        'json.dumps(_results)'
      )
    }

    function buildTestHarness(solutionCode, examples, nary, parentPtr, graph, anyOrder, courseOrder) {
      var meta = extractMethodParams(solutionCode)
      var methodName = meta.methodName
      var params = meta.params
      var hasRootParam = params.some(function(p) { return p.toLowerCase() === 'root' })

      var caseParts = examples.map(function(ex) {
        var inputPy = applyInputAliases(inputToPython(ex.input), params)
        var convLines = []
        var hasAmbientRoot = /\broot\s*=/.test(inputPy) || hasRootParam

        if (/\broot\s*=/.test(inputPy) && !hasRootParam) {
          if (nary) convLines.push('    root = _make_nary(root) if isinstance(root, list) else root')
          else convLines.push('    root = _make_tree(root) if isinstance(root, list) else root')
        }

        params.forEach(function(p) {
          var pn = p.toLowerCase()
          if (graph && (pn === 'node' || pn === 'graph')) {
            convLines.push('    ' + p + ' = _make_graph(' + p + ') if isinstance(' + p + ', list) else ' + p)
            return
          }
          if (pn === 'lists') {
            convLines.push('    ' + p + ' = _make_lists(' + p + ') if isinstance(' + p + ', list) else ' + p)
            return
          }
          if (pn === 'intervals' || pn === 'firstlist' || pn === 'secondlist') {
            if (/Interval/.test(solutionCode)) {
              convLines.push('    ' + p + ' = _make_intervals(' + p + ') if isinstance(' + p + ', list) else ' + p)
            }
            return
          }
          if (TREE_ROOT_PARAMS.indexOf(pn) !== -1) {
            if (nary) {
              convLines.push('    ' + p + ' = _make_nary(' + p + ') if isinstance(' + p + ', list) else (_HNary(' + p + ') if isinstance(' + p + ', int) else ' + p + ')')
            } else {
              convLines.push('    ' + p + ' = _make_tree(' + p + ') if isinstance(' + p + ', list) else (_HTree(' + p + ') if isinstance(' + p + ', int) else ' + p + ')')
            }
            return
          }
          if (TREE_NODE_PARAMS.indexOf(pn) !== -1) {
            if (hasAmbientRoot) {
              if (nary) {
                convLines.push('    ' + p + ' = _make_nary(' + p + ') if isinstance(' + p + ', list) else ((_find_node(root, ' + p + ') or _HNary(' + p + ')) if isinstance(' + p + ', int) else ' + p + ')')
              } else {
                convLines.push('    ' + p + ' = ((_find_node(root, ' + p + ') or _HTree(' + p + ')) if isinstance(' + p + ', int) else (_make_tree(' + p + ') if isinstance(' + p + ', list) else ' + p + '))')
              }
            } else {
              convLines.push('    ' + p + ' = _make_tree(' + p + ') if isinstance(' + p + ', list) else ' + p)
            }
            return
          }
          if (LIST_PARAMS.indexOf(pn) !== -1) {
            // Auto-detect random-pointer format [[val,idx/None],...] vs plain list
            convLines.push('    ' + p + ' = (_make_random_list(' + p + ') if ' + p + ' and isinstance(' + p + '[0],(list,tuple)) and len(' + p + '[0])==2 and (' + p + '[0][1] is None or isinstance(' + p + '[0][1],int)) else _make_list(' + p + ')) if isinstance(' + p + ', list) else ' + p)
          }
        })

        var expectedPy = normalizeExampleText(ex.output)
        var expectedEsc = expectedPy.replace(/\\/g, '\\\\').replace(/'/g, "\\'")
        var inputLines = inputPy.split('\n').map(function(l) { return '    ' + l }).join('\n')
        var convBlock = convLines.length ? convLines.join('\n') + '\n' : ''
        var primary = params.length ? params[0] : null

        var okLine
        if (courseOrder) {
          // Accept any valid topological order; empty means impossible.
          okLine =
            '    if _exp == []:\n' +
            '        _ok = (_got == [] or _got is None)\n' +
            '    else:\n' +
            '        _ok = _course_order_ok(_got, numCourses, prerequisites)\n'
        } else {
          okLine = '    _ok = _ser_cmp(_got, _exp, ' + (anyOrder ? 'True' : 'False') + ')\n'
        }

        return (
          'try:\n' +
          inputLines + '\n' +
          convBlock +
          '    _ret = sol.' + methodName + '(' + params.join(', ') + ')\n' +
          '    _exp = ' + expectedPy + '\n' +
          '    _got = _ret\n' +
          (primary
            ? (
              '    if _got is None and isinstance(_exp, list) and isinstance(' + primary + ', list):\n' +
              '        _got = ' + primary + '\n'
            )
            : '') +
          okLine +
          '    _got_s = ([] if _got is None and _exp == [] else (_got.val if hasattr(_got, "val") and isinstance(_exp, int) and not isinstance(_got, (list, tuple, dict)) else _ser(_got)))\n' +
          '    _results.append({"pass": _ok, "got": str(_got_s), "exp": str(_exp)})\n' +
          'except Exception as _e:\n' +
          '    _results.append({"pass": False, "error": str(_e), "got": "error", "exp": \'' + expectedEsc + '\'})'
        )
      })

      return (
        PYTHON_PREAMBLE + '\n' +
        solutionCode + '\n\n' +
        (nary
          ? (
            'class Node:\n' +
            '    def __init__(self, val=None, children=None):\n' +
            '        self.val = val\n' +
            '        self.children = children if children is not None else []\n' +
            'Node = _HNary\n\n'
          )
          : '') +
        (graph
          ? (
            'class Node:\n' +
            '    def __init__(self, val=0, neighbors=None):\n' +
            '        self.val = val\n' +
            '        self.neighbors = neighbors if neighbors is not None else []\n' +
            'Node = _HGraph\n\n'
          )
          : '') +
        (parentPtr
          ? (
            'class TreeNode:\n' +
            '    def __init__(self, val=0, left=None, right=None, parent=None):\n' +
            '        self.val = val; self.left = left; self.right = right; self.parent = parent\n' +
            'TreeNode = _HTree\n' +
            'Node = _HTree\n\n'
          )
          : '') +
        'sol = Solution()\n' +
        '_results = []\n\n' +
        caseParts.join('\n\n') + '\n\n' +
        'json.dumps(_results)'
      )
    }

    function runSolution(btnId, panelId) {
      var btn = document.getElementById(btnId)
      if (!btn) return
      btn.textContent = 'Loading...'
      btn.classList.add('loading')
      var panel = document.getElementById(panelId)
      if (panel) {
        panel.innerHTML = '<div class="run-loading">Loading Python runtime (~10 MB first run)…</div>'
        panel.classList.add('visible')
      }

      if (lang !== 'python3') {
        showRunError(panelId, btnId, 'Run only works for Python solutions.')
        return
      }

      if (!navigator.onLine) {
        showRunError(panelId, btnId, 'Run requires internet to load Pyodide. Write offline and run when online.')
        return
      }
      var q = currentQuestion()
      if (!q) { showRunError(panelId, btnId, 'No question selected.'); return }

      var fullCode = editorHandle ? editorHandle.getDoc() : ''
      var solutionCode = extractSolutionCode(fullCode)
      if (!solutionCode) { showRunError(panelId, btnId, 'No solution code found in editor.'); return }

      var examples = parseExamples(q)
      if (!examples.length) { showRunError(panelId, btnId, 'No examples found in description.'); return }

      var parentPtr = isParentPointerQuestion(q, solutionCode)
      var graph = parentPtr ? false : isGraphQuestion(q, solutionCode)
      var nary = (parentPtr || graph) ? false : isNaryQuestion(q, solutionCode)
      var anyOrder = descriptionAllowsAnyOrder(q)
      var meta = extractMethodParams(solutionCode)
      var courseOrder = isCourseOrderQuestion(q, meta.methodName)
      var harness = null

      var designEx = examples.filter(function(ex) { return ex.kind === 'design' })
      if (designEx.length) {
        harness = buildDesignHarness(solutionCode, designEx)
      } else if (isCodecQuestion(solutionCode)) {
        harness = buildCodecHarness(solutionCode, examples, nary)
      }
      if (!harness) {
        var normalEx = examples.filter(function(ex) { return ex.kind !== 'design' })
        if (!normalEx.length) { showRunError(panelId, btnId, 'No runnable examples found for this question type.'); return }
        harness = buildTestHarness(solutionCode, normalEx, nary, parentPtr, graph, anyOrder, courseOrder)
      }

      _pyLoadRuntime().then(function(py) {
        if (panel) panel.innerHTML = '<div class="run-loading">Running ' + examples.length + ' test' + (examples.length === 1 ? '' : 's') + '…</div>'
        return py.runPythonAsync(harness)
      }).then(function(pyResult) {
        var arr = []
        try { arr = JSON.parse(String(pyResult)) } catch (e) { arr = [] }
        showRunResults(panelId, btnId, arr)
      }).catch(function(e) {
        showRunError(panelId, btnId, String(e && e.message ? e.message : e))
      })
    }
    // === End Pyodide Offline Runner ===

    function loadEditorScript() {
      if (window.GrindOfflineEditor) return Promise.resolve()
      return new Promise(function(resolve, reject) {
        var done = false
        function finish() { if (!done) { done = true; resolve() } }
        function fail() {
          fetchCached('/grind-offline-editor.js').then(function(r) { return r.text() }).then(function(code) {
            var inline = document.createElement('script')
            inline.textContent = code
            document.head.appendChild(inline)
            finish()
          }).catch(reject)
        }
        var s = document.createElement('script')
        s.src = '/grind-offline-editor.js'
        s.onload = finish
        s.onerror = fail
        document.head.appendChild(s)
      })
    }

    function loadQuestions() {
      return fetch('/grind_questions.json', { cache: 'no-store' })
        .then(function(r) {
          if (r.ok) return r.json()
          throw new Error('network')
        })
        .catch(function() {
          return fetchCached('/grind_questions.json').then(function(r) { return r.json() })
        })
    }

    function loadDescriptions() {
      return fetch('/questions_data_all.json', { cache: 'no-store' })
        .then(function(r) {
          if (r.ok) return r.json()
          throw new Error('network')
        })
        .catch(function() {
          return fetchCached('/questions_data_all.json').then(function(r) { return r.json() })
        })
    }

    loadEditorScript()
      .then(function() {
        return loadQuestions()
      })
      .then(function(qs) {
        questions = qs
        return loadDescriptions().catch(function() { return {} })
      })
      .then(function(desc) {
        descriptions = desc || {}
        migrateAllDrafts()
        buildUI()
        updateConnectivityUI()
        var status = document.getElementById('status')
        if (status) {
          status.textContent = navigator.onLine
            ? questions.length + ' questions · ' + OFFLINE_VERSION
            : 'Offline · ' + OFFLINE_VERSION + ' · saved locally'
        }
        return cacheOfflineBundle().then(function() {
          return cacheAllDescriptionImages()
        })
      })
      .catch(function() {
        document.getElementById('body').innerHTML =
          '<div class="err">Could not load offline Grind. Open the app online once and wait for the download to finish.</div>'
      })
  </script>
</body>
</html>
