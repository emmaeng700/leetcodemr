<body>
  <div class="app">

    </div>
    <header>
      <div class="header-top">
        <div class="header-title-block">
          <h1>The Grind</h1>
          <p class="sub" id="header-sub">PDF study order</p>
        </div>
        <div class="langs">
          <button type="button" id="btn-py" class="on-py" aria-label="Python">Py</button>
          <button type="button" id="btn-cpp" aria-label="C++">C++</button>
        </div>
      </div>
      <div id="count-strip" class="count-strip" aria-live="polite"></div>
      <div class="search-row">
        <button type="button" class="chip-btn nav-btn" id="btn-prev" aria-label="Previous question">&#8249;</button>

        <span class="nav-count" id="nav-count"></span>
        <button type="button" class="chip-btn" id="btn-fast" aria-label="Open fast lists">Fast</button>

    </header>
    <div id="cache-banner" class="cache-banner" role="status"></div>
    <div class="body" id="body">
      <div class="err" id="loading">Loading questions...</div>
    </div>
    <footer id="status">Offline mode</footer>
    <span id="offline-version" hidden>v41</span>
  </div>
  <div class="practice-fs-portal" id="fs-portal">
    <div class="fs-bar">
      <div class="fs-bar-top">
        <span id="fs-meta"></span>
        <span id="fs-reset-count" class="reset-count-badge hidden" aria-hidden="true"></span>
        <div class="langs">
          <button type="button" id="fs-btn-py" class="on-py">Py</button>

        </div>
      </div>
      <div class="fs-bar-bottom">
        <span id="fs-context"></span>
        <button type="button" class="chip-btn nav-btn" id="btn-fs-prev" aria-label="Previous question">&#8249;</button>
        <button type="button" class="chip-btn nav-btn" id="btn-fs-next" aria-label="Next question">&#8250;</button>
        <button type="button" class="chip-btn" id="btn-fs-close" aria-label="Close full screen editor">Close</button>
      </div>
    </div>
    <div class="fs-desc-pane" id="fs-desc-pane" role="region" aria-label="Problem description">
      <div class="fs-desc-head">
        <span>Problem Description</span>
        <button type="button" class="fs-desc-toggle" id="btn-fs-desc-toggle" aria-expanded="true">Hide</button>
      </div>
      <div class="fs-desc-body" id="fs-desc-body"></div>
    </div>
    <div class="fs-editor practice-cm-wrap"><div id="editor-host-fs"></div></div>
    <div class="editor-footer">
      <div class="editor-footer-left">
        <span class="editor-hint">no submit - write from memory</span>
      </div>
      <div class="editor-footer-actions">
        <button type="button" class="chip-btn" id="btn-undo-fs" aria-label="Undo">&#x21A9;</button>
        <button type="button" class="chip-btn" id="btn-redo-fs" aria-label="Redo">&#x21AA;</button>
        <button type="button" class="chip-btn" id="btn-copy-fs" aria-label="Copy all code">Copy</button>
        <button type="button" class="chip-btn" id="btn-reset-fs">Reset to starter</button>
      </div>
    </div>
  </div>
  <script>
    var questions = []
    var descriptions = {}
    var OFFLINE_VERSION = 'v41'
    var SW_CACHE = 'lm-v31'
    var DESC_IMG_CACHE_KEY = 'lm_desc_images_cached_v2'
    var ALL_DIFFS = ['Easy', 'Medium', 'Hard']
    var ALL_PRIOS = ['High', 'Mid', 'Low']
    var ALL_SETS = [1, 2, 3]
    var FAST_PATTERN_ORDER = [
      'Arrays & Hashing', 'String', 'Two Pointers', 'Sliding Window', 'Sorting',
      'Binary Search', 'Matrix', 'Trees & BST', 'DFS', 'Graphs', 'BFS',
      'Linked List', 'Stack', 'Heap', 'Trie', 'Backtracking', 'Greedy',
      'Dynamic Programming', 'Bit Manipulation', 'Math', 'JavaScript'
    ]
    var FAST_TIER_ABBREV = {
      'High Easy': 'HE', 'High Medium': 'HM', 'High Hard': 'HH',
      'Mid Easy': 'ME', 'Mid Medium': 'MM', 'Mid Hard': 'MH',
      'Low Easy': 'LE', 'Low Medium': 'LM', 'Low Hard': 'LH'
    }
    var FAST_PATTERN_ABBREV = {
      'Arrays & Hashing': 'A&H', 'String': 'Str', 'Two Pointers': '2P',
      'Sliding Window': 'SW', 'Sorting': 'Sort', 'Binary Search': 'BS',
      'Matrix': 'Mtx', 'Trees & BST': 'Trees', 'DFS': 'DFS', 'Graphs': 'Gph',
      'BFS': 'BFS', 'Linked List': 'LL', 'Stack': 'Stk', 'Heap': 'Heap',
      'Trie': 'Trie', 'Backtracking': 'BT', 'Greedy': 'Grdy',
      'Dynamic Programming': 'DP', 'Bit Manipulation': 'BitM',
      'Math': 'Math', 'JavaScript': 'JS'
    }
    var FAST_SET_COLOR = { 1: '#89b4fa', 2: '#a6e3a1', 3: '#cba6f7' }
    var FAST_PRIO_COLOR = { High: '#f38ba8', Mid: '#fab387', Low: '#a6adc8' }
    var FAST_PRIO_BG = {
      High: 'rgba(243,139,168,0.08)',
      Mid: 'rgba(250,179,135,0.08)',
      Low: 'rgba(166,173,200,0.08)'
    }
    function defaultGrindFilters() {
      return {
        difficulties: { Easy: true, Medium: true, Hard: true },
        priorities: { High: true, Mid: true, Low: true },
        sets: { 1: true, 2: true, 3: true },
        pattern: 'all',
      }
    }
    var grindFilters = defaultGrindFilters()
    var filtered = []
    var selectedId = 0
    var lang = 'python3'
    var editorHandle = null
    var editorHostId = 'editor-host'
    var listOpen = false
    var fastListOpen = false
    var editorExpanded = false
    var fsDescCollapsed = false
    var wasOffline = (function() {
      try {
        return sessionStorage.getItem('lm_grind_was_offline') === '1' || !navigator.onLine
      } catch (e) {
        return !navigator.onLine
      }
    })()
    var copyFlashTimer = null
    var RESET_COUNTS_KEY = 'lm_grind_reset_counts'
    var LAST_QUESTION_KEY = 'lm_grind_last_question_id'
    var ltsSort = true
    var DISPLAY_PATTERN_ORDER = [
      'Arrays & Hashing','String','Two Pointers','Sliding Window','Sorting',
      'Binary Search','Matrix','Trees & BST','DFS','Graphs','BFS',
      'Linked List','Stack','Heap','Trie','Backtracking','Greedy',
      'Dynamic Programming','Bit Manipulation','Math','JavaScript'
    ]
    var LTS_BAND_LABEL = { large:'16+q · deep work', medium:'10–15q · solid blocks', small:'5–9q · short runs', mini:'1–4q · micro' }
    var ltsRoundMap = {}
    var ltsLabelMap = {}

    function ltsBand(n) { return n >= 16 ? 'large' : n >= 10 ? 'medium' : n >= 5 ? 'small' : 'mini' }

    function ltsApply(arr) {
      var sizes = {}
      questions.forEach(function(q) {
        if (!q.section) return
        var k = q.section + '|' + q.set
        sizes[k] = (sizes[k] || 0) + 1
      })
      var priOrd = { High: 0, Mid: 1, Low: 2 }
      var diffOrd = { Easy: 0, Medium: 1, Hard: 2 }
      var SEC_RE = /^(High|Mid|Low) (Easy|Medium|Hard) - /
      return arr.slice().sort(function(a, b) {
        if (!a.section && !b.section) return a.id - b.id
        if (!a.section) return 1
        if (!b.section) return -1
        var ma = SEC_RE.exec(a.section), mb = SEC_RE.exec(b.section)
        var na = sizes[a.section + '|' + a.set] || 0, nb = sizes[b.section + '|' + b.set] || 0
        var bandOrd = function(n) { return n >= 16 ? 0 : n >= 10 ? 1 : n >= 5 ? 2 : 3 }
        var bo = bandOrd(na) - bandOrd(nb)
        if (bo !== 0) return bo
        var po = (ma ? (priOrd[ma[1]] != null ? priOrd[ma[1]] : 9) : 9) -
                 (mb ? (priOrd[mb[1]] != null ? priOrd[mb[1]] : 9) : 9)
        if (po !== 0) return po
        var dif = (ma ? (diffOrd[ma[2]] != null ? diffOrd[ma[2]] : 9) : 9) -
                  (mb ? (diffOrd[mb[2]] != null ? diffOrd[mb[2]] : 9) : 9)
        if (dif !== 0) return dif
        if (na !== nb) return nb - na
        if (a.set !== b.set) return a.set - b.set
        var pi = DISPLAY_PATTERN_ORDER.indexOf(a.pattern || '')
        var pj = DISPLAY_PATTERN_ORDER.indexOf(b.pattern || '')
        if (pi !== -1 && pj !== -1 && pi !== pj) return pi - pj
        return a.id - b.id
      })
    }

    function readLastQuestionId() {
      try {
        var id = parseInt(localStorage.getItem(LAST_QUESTION_KEY) || '0', 10)
        return isFinite(id) && id > 0 ? id : 0
      } catch (e) {
        return 0
      }
    }

    function writeLastQuestionId(id) {
      if (!id || id < 1) return
      try { localStorage.setItem(LAST_QUESTION_KEY, String(id)) } catch (e) {}
    }

    function readResetCounts() {
      try { return JSON.parse(localStorage.getItem(RESET_COUNTS_KEY) || '{}') } catch (e) { return {} }
    }

    function readResetCount(id) {
      return readResetCounts()[String(id)] || 0
    }

    function incrementResetCount(id) {
      var all = readResetCounts()
      all[String(id)] = (all[String(id)] || 0) + 1
      try { localStorage.setItem(RESET_COUNTS_KEY, JSON.stringify(all)) } catch (e) {}
      try { renderList() } catch (e) {}
      return all[String(id)]
    }

    function resetButtonLabel(count) {
      if (count > 0) {
        return 'Reset to starter <span class="reset-count-chip">↺' + count + '</span>'
      }
      return 'Reset to starter'
    }

    function updateResetButtonLabels() {
      var q = currentQuestion()
      var count = q ? readResetCount(q.id) : 0
      var html = resetButtonLabel(count)
      var btnReset = document.getElementById('btn-reset')
      var btnResetFs = document.getElementById('btn-reset-fs')
      if (btnReset) btnReset.innerHTML = html
      if (btnResetFs) btnResetFs.innerHTML = html
      var fsBadge = document.getElementById('fs-reset-count')
      if (fsBadge) {
        if (count > 0) {
          fsBadge.textContent = '↺' + count
          fsBadge.classList.remove('hidden')
          fsBadge.removeAttribute('aria-hidden')
        } else {
          fsBadge.textContent = ''
          fsBadge.classList.add('hidden')
          fsBadge.setAttribute('aria-hidden', 'true')
        }
      }
    }

    function mergeResetCountMaps() {
      var merged = {}
      for (var i = 0; i < arguments.length; i++) {
        var map = arguments[i] || {}
        for (var k in map) {
          if (!Object.prototype.hasOwnProperty.call(map, k)) continue
          var n = Number(map[k]) || 0
          if (n > 0) merged[k] = Math.max(merged[k] || 0, n)
        }
      }
      return merged
    }

    function syncResetCountsOnline() {
      if (!navigator.onLine) return Promise.resolve()
      var local = readResetCounts()
      return fetch('/api/grind-reset-counts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ counts: local }),
      }).then(function(res) {
        if (!res.ok) return null
        return res.json()
      }).then(function(data) {
        if (!data || !data.counts) return
        var merged = mergeResetCountMaps(local, data.counts)
        try { localStorage.setItem(RESET_COUNTS_KEY, JSON.stringify(merged)) } catch (e) {}
        updateResetButtonLabels()
        try { renderList() } catch (e) {}
      }).catch(function() {})
    }

    function flashCopyButton(btn) {
      if (!btn) return
      btn.textContent = 'Copied!'
      btn.classList.add('copied')
      if (copyFlashTimer) clearTimeout(copyFlashTimer)
      copyFlashTimer = setTimeout(function() {
        btn.textContent = 'Copy'
        btn.classList.remove('copied')
      }, 2000)
    }

    function fallbackCopyText(text) {
      var ta = document.createElement('textarea')
      ta.value = text
      ta.setAttribute('readonly', '')
      ta.style.position = 'fixed'
      ta.style.left = '-9999px'
      document.body.appendChild(ta)
      ta.select()
      try { document.execCommand('copy') } catch (e) {}
      document.body.removeChild(ta)
    }

    function copyEditorCode(btn) {
      if (!editorHandle) return
      var text = editorHandle.getDoc()
      if (!text) return
      var done = function() { flashCopyButton(btn) }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function() {
          fallbackCopyText(text)
          done()
        })
      } else {
        fallbackCopyText(text)
        done()
      }
    }

    function updateConnectivityUI() {
      var online = navigator.onLine
      var offlineBanner = document.getElementById('offline-banner')
      var onlineBanner = document.getElementById('online-banner')
      var status = document.getElementById('status')
      var grindLink = document.getElementById('link-full-grind')
      if (offlineBanner) offlineBanner.classList.toggle('hidden', online)
      if (onlineBanner) onlineBanner.classList.toggle('show', online)
      if (status) {
        status.textContent = online
          ? questions.length + ' questions'
          : 'Offline mode - saved locally'
      }
      if (!online) {
        wasOffline = true
        try { sessionStorage.setItem('lm_grind_was_offline', '1') } catch (e) {}
        setCacheBanner('', false)
      } else {
        void syncResetCountsOnline()
        void prefetchAcceptedForOffline()
      }
    }
    window.addEventListener('online', updateConnectivityUI)
    window.addEventListener('offline', updateConnectivityUI)
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        if (navigator.onLine) void syncResetCountsOnline()
      }
    })

    function draftKey(id) { return 'lm_grind_' + id + '_' + lang }
    function starterKey(id) { return 'lm_grind_starter_' + id + '_' + lang }

    function normalizeGrindCode(code) {
      var out = code.replace(/\r\n/g, '\n').replace(/\r/g, '\n')
      if (out.indexOf('\n') < 0 && out.indexOf('\\n') >= 0) {
        out = out.replace(/\\n/g, '\n').replace(/\\t/g, '\t')
      }
      return out
    }

    /* Legacy "# Grind:" / "// Grind:" header cleanup (feature removed). */
    function hasGrindStamp(code) {
      var first = (code.split('\n')[0] || '').trim()
      return lang === 'python3' ? first.indexOf('# Grind:') === 0 : first.indexOf('// Grind:') === 0
    }

    function stripGrindStamp(code) {
      if (!hasGrindStamp(code)) return code
      return code.split('\n').slice(1).join('\n')
    }

    function runGrindCodePipeline(id, code, starter, script, isStarter) {
      var raw = isStarter ? code : stripGrindStamp(normalizeGrindCode(code))
      var result = upgradeCodeWithInterview(raw, starter, script)
      return { code: result }
    }

    function titleComment(q) {
      return lang === 'python3' ? '# ' + q.title : '// ' + q.title
    }

    function genericStarter(q) {
      var body = lang === 'python3'
        ? 'class Solution:\n    def solve(self):\n        pass\n'
        : 'class Solution {\npublic:\n    void solve() {};\n};\n'
      return titleComment(q) + '\n' + body
    }

    var DESCRIPTION_MARKER_PY = '# -- Problem Description --'
    var DESCRIPTION_MARKER_CPP = '// -- Problem Description --'
    var INTERVIEW_MARKER_PY = '# -- Interview Approach - STAR-LC --'
    var INTERVIEW_MARKER_CPP = '// -- Interview Approach - STAR-LC --'
    var ACCEPTED_MARKER_PY = '# -- Your LeetCode Accepted --'
    var ACCEPTED_MARKER_CPP = '// -- Your LeetCode Accepted --'
    var LEARNING_SEP = '\n\n\n\n'

    function descriptionMarker() {
      return lang === 'python3' ? DESCRIPTION_MARKER_PY : DESCRIPTION_MARKER_CPP
    }

    function interviewMarker() {
      return lang === 'python3' ? INTERVIEW_MARKER_PY : INTERVIEW_MARKER_CPP
    }

    function acceptedMarker() {
      return lang === 'python3' ? ACCEPTED_MARKER_PY : ACCEPTED_MARKER_CPP
    }

    function lcAcceptedCacheKey(id) {
      return 'lm_grind_lc_ac_' + id + '_' + lang
    }

    function readLcAcceptedCache(id) {
      try {
        var raw = localStorage.getItem(lcAcceptedCacheKey(id))
        if (!raw) return null
        var parsed = JSON.parse(raw)
        if (typeof parsed.code !== 'string') return null
        var out = {
          code: parsed.code,
          empty: parsed.empty === true || !String(parsed.code).trim(),
          submissionTs: undefined,
        }
        if (typeof parsed.submissionTs === 'number' && isFinite(parsed.submissionTs)) {
          out.submissionTs = parsed.submissionTs
        }
        return out
      } catch (e) {
        return null
      }
    }

    function writeLcAcceptedCache(id, code, submissionTs) {
      var entry = {
        code: String(code || '').trim(),
        fetchedAt: new Date().toISOString(),
        empty: !String(code || '').trim(),
      }
      if (typeof submissionTs === 'number' && isFinite(submissionTs)) {
        entry.submissionTs = submissionTs
      }
      try {
        localStorage.setItem(lcAcceptedCacheKey(id), JSON.stringify(entry))
      } catch (e) {}
      if (!navigator.onLine) return
      fetch('/api/grind-lc-accepted', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          item: {
            question_id: id,
            lang: lang,
            code: entry.code,
            empty: entry.empty,
            fetched_at: entry.fetchedAt,
          },
        }),
      }).catch(function() {})
    }

    function hydrateLcAcceptedFromRemote() {
      if (!navigator.onLine) return Promise.resolve(0)
      return fetch('/api/grind-lc-accepted', { cache: 'no-store' })
        .then(function(r) { return r.ok ? r.json() : null })
        .then(function(data) {
          if (!data || !Array.isArray(data.items)) return 0
          var ready = 0
          data.items.forEach(function(item) {
            if (item.lang !== lang) return
            var local = readLcAcceptedCache(item.question_id)
            var remoteReady = !item.empty && item.code && String(item.code).trim()
            if (remoteReady && (!local || local.empty)) {
              try {
                localStorage.setItem(lcAcceptedCacheKey(item.question_id), JSON.stringify({
                  code: String(item.code).trim(),
                  fetchedAt: item.fetched_at || new Date().toISOString(),
                  empty: false,
                }))
              } catch (e) {}
              ready++
            } else if (remoteReady) {
              ready++
            }
          })
          return ready
        })
        .catch(function() { return 0 })
    }

    function commentLine(text) {
      text = text == null ? '' : String(text)
      if (lang === 'python3') return text ? '# ' + text : '#'
      return text ? '// ' + text : '//'
    }

    function formatAcceptedSection(acceptedCode, kind) {
      var marker = acceptedMarker()
      var header = [
        marker,
        commentLine('Latest accepted submission from leetcode.com (cached for offline).'),
        commentLine(''),
      ].join('\n')
      if (kind === 'uncached') {
        return [
          header,
          commentLine('Not downloaded for offline yet.'),
          commentLine('Stay online in Grind - it caches accepted solutions in the background.'),
        ].join('\n')
      }
      if (kind === 'empty' || !acceptedCode || !String(acceptedCode).trim()) {
        return [
          header,
          commentLine('No accepted solution found for this language yet.'),
          commentLine('Go to LeetCode, get Accepted, then reopen Grind while online'),
          commentLine('so it can cache this section for offline use.'),
        ].join('\n')
      }
      var body = String(acceptedCode).replace(/\r\n/g, '\n').replace(/\s+$/, '')
      return header + '\n' + body
    }

    function stripAcceptedSection(code) {
      var idx = code.indexOf(acceptedMarker())
      if (idx < 0) return code
      return code.slice(0, idx).replace(/\s+$/, '')
    }

    function upsertAcceptedSection(code, acceptedCode, kind) {
      var section = formatAcceptedSection(acceptedCode, kind || (acceptedCode && String(acceptedCode).trim() ? 'ready' : 'empty'))
      var base = stripAcceptedSection(code).replace(/\s+$/, '')
      return base + LEARNING_SEP + section + '\n'
    }

    function getCookieFromHeader(cookieHeader, name) {
      var parts = String(cookieHeader || '').replace(/^cookie:\s*/i, '').split(';')
      for (var i = 0; i < parts.length; i++) {
        var eq = parts[i].indexOf('=')
        if (eq < 0) continue
        if (parts[i].slice(0, eq).trim() === name) return parts[i].slice(eq + 1).trim()
      }
      return ''
    }

    function fetchLatestAcceptedMeta(slug) {
      if (!navigator.onLine) return Promise.resolve(null)
      var session = ''
      var csrf = ''
      try {
        session = localStorage.getItem('lc_session') || ''
        csrf = localStorage.getItem('lc_csrf') || getCookieFromHeader(session, 'csrftoken')
      } catch (e) {}
      if (!session || !csrf) return Promise.resolve(null)

      var want = lang === 'python3' ? 'python' : 'cpp'
      return fetch('/api/leetcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session: session,
          csrfToken: csrf,
          query: 'query($slug:String!,$offset:Int!,$limit:Int!){questionSubmissionList(questionSlug:$slug,offset:$offset,limit:$limit,status:10){submissions{id lang timestamp}}}',
          variables: { slug: slug, offset: 0, limit: 40 },
        }),
      }).then(function(r) { return r.json() }).then(function(r1) {
        var subs = (((r1 || {}).data || {}).questionSubmissionList || {}).submissions || []
        var match = null
        for (var i = 0; i < subs.length; i++) {
          var l = String(subs[i].lang || '').toLowerCase()
          if (want === 'python' && (l === 'python3' || l === 'python')) { match = subs[i]; break }
          if (want === 'cpp' && l === 'cpp') { match = subs[i]; break }
        }
        if (!match) return { kind: 'empty' }
        return {
          kind: 'hit',
          id: Number(match.id),
          submissionTs: Number(match.timestamp) || 0,
        }
      }).catch(function() { return null })
    }

    function fetchSubmissionCodeById(submissionId, session, csrf) {
      return fetch('/api/leetcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session: session,
          csrfToken: csrf,
          query: 'query($id:Int!){submissionDetails(submissionId:$id){code}}',
          variables: { id: Number(submissionId) },
        }),
      }).then(function(r) { return r.json() }).then(function(r2) {
        return String((((r2 || {}).data || {}).submissionDetails || {}).code || '').trim()
      }).catch(function() { return null })
    }

    function fetchLcAcceptedCode(slug) {
      var session = ''
      var csrf = ''
      try {
        session = localStorage.getItem('lc_session') || ''
        csrf = localStorage.getItem('lc_csrf') || getCookieFromHeader(session, 'csrftoken')
      } catch (e) {}
      if (!session || !csrf) return Promise.resolve(null)

      return fetchLatestAcceptedMeta(slug).then(function(meta) {
        if (meta === null) return null
        if (meta.kind === 'empty') return { code: '', submissionTs: 0 }
        return fetchSubmissionCodeById(meta.id, session, csrf).then(function(code) {
          if (code === null) return null
          return { code: code, submissionTs: meta.submissionTs }
        })
      })
    }

    function resolveLcAcceptedCode(q) {
      var cached = readLcAcceptedCache(q.id)
      var solvedHint = false
      try {
        var syncRaw = localStorage.getItem('lm_leetcode_list_sync')
        if (syncRaw) {
          var sync = JSON.parse(syncRaw)
          if (sync && Array.isArray(sync.solvedIds)) solvedHint = sync.solvedIds.indexOf(q.id) >= 0
        }
      } catch (e) {}

      if (!navigator.onLine) {
        if (cached && !cached.empty) return Promise.resolve({ status: 'ready', code: cached.code })
        if (cached && cached.empty && !solvedHint) return Promise.resolve({ status: 'empty' })
        return Promise.resolve({ status: 'uncached' })
      }

      var session = ''
      var csrf = ''
      try {
        session = localStorage.getItem('lc_session') || ''
        csrf = localStorage.getItem('lc_csrf') || getCookieFromHeader(session, 'csrftoken')
      } catch (e) {}
      if (!session || !csrf) {
        if (cached && !cached.empty) return Promise.resolve({ status: 'ready', code: cached.code })
        if (cached && cached.empty && !solvedHint) return Promise.resolve({ status: 'empty' })
        return Promise.resolve({ status: 'uncached' })
      }

      return fetchLatestAcceptedMeta(q.slug).then(function(meta) {
        if (meta === null) {
          if (cached && !cached.empty) return { status: 'ready', code: cached.code }
          if (cached && cached.empty && !solvedHint) return { status: 'empty' }
          return { status: 'uncached' }
        }
        if (meta.kind === 'empty') {
          writeLcAcceptedCache(q.id, '', 0)
          return { status: 'empty' }
        }
        if (
          cached &&
          !cached.empty &&
          typeof cached.submissionTs === 'number' &&
          cached.submissionTs === meta.submissionTs
        ) {
          return { status: 'ready', code: cached.code }
        }
        return fetchSubmissionCodeById(meta.id, session, csrf).then(function(code) {
          if (code === null) {
            if (cached && !cached.empty) return { status: 'ready', code: cached.code }
            return { status: 'uncached' }
          }
          writeLcAcceptedCache(q.id, code, meta.submissionTs)
          if (String(code).trim()) return { status: 'ready', code: code }
          return { status: 'empty' }
        })
      })
    }

    function applyAcceptedToEditor(q, code) {
      return resolveLcAcceptedCode(q).then(function(resolved) {
        var next = code
        if (resolved.status === 'ready') next = upsertAcceptedSection(code, resolved.code, 'ready')
        else if (resolved.status === 'empty') next = upsertAcceptedSection(code, null, 'empty')
        else next = upsertAcceptedSection(code, null, 'uncached')
        if (next !== code) {
          try { localStorage.setItem(draftKey(q.id), next) } catch (e) {}
          if (editorHandle && selectedId === q.id) editorHandle.setDoc(next)
        }
        return next
      })
    }

    function setCacheBanner(text, show) {
      var el = document.getElementById('cache-banner')
      if (!el) return
      el.textContent = text || ''
      el.classList.toggle('show', !!show)
    }

    function prefetchAcceptedForOffline() {
      if (!navigator.onLine) {
        setCacheBanner('', false)
        return Promise.resolve()
      }
      var session = ''
      var csrf = ''
      try {
        session = localStorage.getItem('lc_session') || ''
        csrf = localStorage.getItem('lc_csrf') || getCookieFromHeader(session, 'csrftoken')
      } catch (e) {}

      return hydrateLcAcceptedFromRemote().then(function(remoteReady) {
        if (!session || !csrf) {
          if (remoteReady > 0) {
            setCacheBanner('Synced ' + remoteReady + ' accepted solutions from your other devices.', true)
          } else {
            setCacheBanner('Online: connect LeetCode session (Clipboard Use) to cache accepted solutions offline.', true)
          }
          return
        }

        var solvedIds = []
        try {
          var syncRaw = localStorage.getItem('lm_leetcode_list_sync')
          if (syncRaw) {
            var sync = JSON.parse(syncRaw)
            if (sync && Array.isArray(sync.solvedIds)) solvedIds = sync.solvedIds
          }
        } catch (e) {}

        var pool = solvedIds.length
          ? questions.filter(function(q) { return solvedIds.indexOf(q.id) >= 0 })
          : []
        if (!pool.length) {
          if (remoteReady > 0) {
            setCacheBanner('Synced ' + remoteReady + ' accepted solutions from your other devices.', true)
          } else {
            setCacheBanner('Online: sync LeetCode list once, then Grind will cache accepted solutions for offline.', true)
          }
          return
        }

        var todo = pool.filter(function(q) {
          var c = readLcAcceptedCache(q.id)
          if (c && !c.empty) return false
          if (c && c.empty && solvedIds.indexOf(q.id) >= 0) return true
          return !c
        })
        var done = pool.length - todo.length
        var cached = done
        setCacheBanner('Caching accepted solutions for offline (syncs across devices)… ' + done + '/' + pool.length, true)

        var i = 0
        function tick() {
          if (!navigator.onLine || i >= todo.length) {
            setCacheBanner('Offline + cloud cache ready: ' + cached + ' accepted solutions for ' + (lang === 'python3' ? 'Python' : 'C++'), true)
            return Promise.resolve()
          }
          var q = todo[i++]
          return fetchLcAcceptedCode(q.slug).then(function(fetched) {
            if (fetched !== null) {
              writeLcAcceptedCache(q.id, fetched.code, fetched.submissionTs)
              if (fetched.code && fetched.code.trim()) cached++
            }
            done++
            setCacheBanner('Caching accepted solutions for offline (syncs across devices)… ' + done + '/' + pool.length + ' (' + cached + ' ready)', true)
            return new Promise(function(resolve) { setTimeout(resolve, 350) }).then(tick)
          })
        }
        return tick()
      })
    }

    function htmlToPlainText(html) {
      var raw = String(html || '').trim()
      if (!raw) return ''
      var text = raw
      if (raw.indexOf('<') >= 0) {
        text = raw
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<\/p>/gi, '\n')
          .replace(/<\/li>/gi, '\n')
          .replace(/<[^>]+>/g, ' ')
      }
      return text
        .replace(/\r\n/g, '\n')
        .replace(/\u00a0/g, ' ')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim()
    }

    function descriptionForLang(description) {
      var plain = htmlToPlainText(description)
      if (!plain) return ''
      return plain.split('\n').map(function(line) {
        var trimmed = line.replace(/\s+$/, '')
        if (lang === 'python3') return trimmed ? '# ' + trimmed : '#'
        return trimmed ? '// ' + trimmed : '//'
      }).join('\n')
    }

    function starterHasDescription(starter) {
      return starter.indexOf(descriptionMarker()) >= 0
    }

    function starterHasInterview(starter) {
      var marker = interviewMarker()
      return starter.indexOf(marker) >= 0 || starter.indexOf('# PHASE 1') >= 0 || starter.indexOf('// PHASE 1') >= 0
    }

    function findLastCheckLineIndex(code) {
      var lines = code.split('\n')
      var last = -1
      for (var i = 0; i < lines.length; i++) {
        if (lines[i].trim().indexOf('_check(') === 0) last = i
      }
      return last
    }

    function interviewScriptForLang(script) {
      if (lang === 'python3') return script.replace(/\s+$/, '')
      return script.replace(/\s+$/, '').split('\n').map(function(line) {
        if (!line) return ''
        if (line.indexOf('#') === 0) return '//' + line.slice(1)
        return '// ' + line
      }).join('\n')
    }

    function stripLearningSections(code) {
      var markers = [descriptionMarker(), interviewMarker(), acceptedMarker(), lang === 'python3' ? '# PHASE 1' : '// PHASE 1']
      var cut = code.length
      for (var mi = 0; mi < markers.length; mi++) {
        var idx = code.indexOf(markers[mi])
        if (idx >= 0) cut = Math.min(cut, idx)
      }
      if (cut < code.length) return code.slice(0, cut).replace(/\s+$/, '')
      return code
    }

    function stripDescriptionSection(code) {
      var marker = descriptionMarker()
      var start = code.indexOf(marker)
      if (start < 0) return code
      var tail = code.slice(start)
      var iaIdx = tail.indexOf(interviewMarker())
      var phaseIdx = tail.indexOf(lang === 'python3' ? '# PHASE 1' : '// PHASE 1')
      var acIdx = tail.indexOf(acceptedMarker())
      var end = tail.length
      if (iaIdx > 0) end = Math.min(end, iaIdx)
      if (phaseIdx > 0) end = Math.min(end, phaseIdx)
      if (acIdx > 0) end = Math.min(end, acIdx)
      var before = code.slice(0, start).replace(/\s+$/, '')
      var after = tail.slice(end).replace(/^\s+/, '')
      if (!after) return before
      return before + '\n\n' + after
    }

    function codeBaseForLearningInsert(code) {
      var stripped = stripLearningSections(code)
      if (stripped.length < code.length) return stripped
      return codeBaseForInterviewInsert(code)
    }

    function formatDescriptionBlock(description) {
      var body = descriptionForLang(description)
      if (!body) return ''
      return descriptionMarker() + '\n' + body
    }

    function formatInterviewBlock(script) {
      return interviewMarker() + '\n' + interviewScriptForLang(script)
    }

    function extractDescriptionSection(starter) {
      var marker = descriptionMarker()
      var start = starter.indexOf(marker)
      if (start < 0) return ''
      var tail = starter.slice(start)
      var iaIdx = tail.indexOf(interviewMarker())
      var phaseIdx = tail.indexOf(lang === 'python3' ? '# PHASE 1' : '// PHASE 1')
      var acIdx = tail.indexOf(acceptedMarker())
      var end = tail.length
      if (iaIdx > 0) end = Math.min(end, iaIdx)
      if (phaseIdx > 0) end = Math.min(end, phaseIdx)
      if (acIdx > 0) end = Math.min(end, acIdx)
      return tail.slice(0, end).replace(/\s+$/, '')
    }

    function appendGrindLearning(starter, description, script) {
      var hasDesc = starterHasDescription(starter)
      var hasIa = starterHasInterview(starter)
      if (hasDesc && hasIa) return starter
      var base = codeBaseForLearningInsert(stripLearningSections(starter)).replace(/\s+$/, '')
      var parts = []
      if (!hasDesc) {
        var descBlock = extractDescriptionSection(starter) || (description && String(description).trim() ? formatDescriptionBlock(description) : '')
        if (descBlock) parts.push(descBlock)
      }
      if (!hasIa) {
        var iaBlock = extractInterviewSection(starter) || (script && String(script).trim() ? formatInterviewBlock(script) : '')
        if (iaBlock) parts.push(iaBlock)
      }
      if (!parts.length) return starter
      return base + LEARNING_SEP + parts.join(LEARNING_SEP) + '\n'
    }

    function appendInterviewApproach(starter, script) {
      return appendGrindLearning(starter, null, script)
    }

    function extractInterviewSection(starter) {
      var marker = interviewMarker()
      var markerIdx = starter.indexOf(marker)
      if (markerIdx < 0) {
        var phase = lang === 'python3' ? '# PHASE 1' : '// PHASE 1'
        markerIdx = starter.indexOf(phase)
      }
      if (markerIdx < 0) return ''
      var tail = starter.slice(markerIdx)
      var acIdx = tail.indexOf(acceptedMarker())
      if (acIdx > 0) return tail.slice(0, acIdx).replace(/\s+$/, '')
      return tail.replace(/\s+$/, '')
    }

    function starterHasExamples(starter) {
      return starter.indexOf('# ── Examples ──') >= 0 || starter.indexOf('# ── Test ──') >= 0
    }

    function upgradeCodeWithLearning(code, starter, description, script) {
      var hasEx = starterHasExamples(code)
      var hasDesc = starterHasDescription(code)
      var hasIa = starterHasInterview(code)
      if (hasEx && hasDesc && hasIa) return code
      var base = codeBaseForLearningInsert(code)
      if (!hasEx) {
        var starterBase = codeBaseForLearningInsert(starter)
        if (starterHasExamples(starterBase)) base = starterBase
      }
      var parts = []
      if (!hasDesc) {
        var descBlock = extractDescriptionSection(starter) || (description && String(description).trim() ? formatDescriptionBlock(description) : '')
        if (descBlock) parts.push(descBlock)
      }
      if (!hasIa) {
        var iaBlock = extractInterviewSection(starter) || (script && String(script).trim() ? formatInterviewBlock(script) : '')
        if (iaBlock) parts.push(iaBlock)
      }
      if (!parts.length) return code
      return base + LEARNING_SEP + parts.join(LEARNING_SEP) + '\n'
    }

    function upgradeCodeWithInterview(code, starter, script) {
      var stripped = stripDescriptionSection(code)
      return upgradeCodeWithLearning(stripped, starter, null, script)
    }

    function codeBaseForInterviewInsert(code) {
      var lines = code.split('\n')
      var lastCheck = findLastCheckLineIndex(code)
      if (lastCheck >= 0) return lines.slice(0, lastCheck + 1).join('\n')
      var testIdx = -1
      for (var i = 0; i < lines.length; i++) {
        var t = lines[i].trim()
        if ((t.indexOf('Test') >= 0 || t.indexOf('Examples') >= 0) && t.indexOf('#') === 0) testIdx = i
      }
      if (testIdx >= 0) {
        var end = testIdx
        for (var j = testIdx + 1; j < lines.length; j++) {
          var u = lines[j].trim()
          if (u.indexOf('Problem Description') >= 0 || u.indexOf('Interview Approach') >= 0 || u.indexOf('Your LeetCode Accepted') >= 0 || u.indexOf('PHASE 1') >= 0) break
          end = j
        }
        return lines.slice(0, end + 1).join('\n')
      }
      return code.replace(/\s+$/, '')
    }

    function migrateAllDrafts() {
      try {
        if (localStorage.getItem('lm_grind_strip_desc_v1')) return
      } catch (e) { return }
      var langs = ['python3', 'cpp']
      for (var qi = 0; qi < questions.length; qi++) {
        var q = questions[qi]
        for (var li = 0; li < langs.length; li++) {
          var savedLang = lang
          lang = langs[li]
          try {
            var d = localStorage.getItem(draftKey(q.id))
            if (d !== null) {
              var starter = starterFor(q)
              var next = upgradeCodeWithInterview(d, starter, q.interviewApproach)
              if (next !== d) localStorage.setItem(draftKey(q.id), next)
            }
            var cachedStarter = localStorage.getItem(starterKey(q.id))
            if (cachedStarter !== null) {
              var cleanedStarter = upgradeCodeWithInterview(cachedStarter, cachedStarter, q.interviewApproach)
              if (cleanedStarter !== cachedStarter) localStorage.setItem(starterKey(q.id), cleanedStarter)
            }
          } catch (e) {}
          lang = savedLang
        }
      }
      try { localStorage.setItem('lm_grind_strip_desc_v1', String(Date.now())) } catch (e) {}
    }

    function starterFor(q) {
      var bundled = lang === 'python3' ? q.starterPython : q.starterCpp
      if (bundled) {
        bundled = normalizeGrindCode(bundled)
        var c = titleComment(q)
        if (bundled.indexOf(c) !== 0) bundled = c + '\n' + bundled
        return appendInterviewApproach(bundled, q.interviewApproach)
      }
      try {
        var cached = localStorage.getItem(starterKey(q.id))
        if (cached) return appendInterviewApproach(cached, q.interviewApproach)
      } catch (e) {}
      return appendInterviewApproach(genericStarter(q), q.interviewApproach)
    }

    function loadCode(q) {
      var starter = starterFor(q)
      var code = starter
      try {
        var d = localStorage.getItem(draftKey(q.id))
        if (d !== null) {
          var piped = runGrindCodePipeline(q.id, d, starter, q.interviewApproach, false)
          if (piped.code !== d) {
            try { localStorage.setItem(draftKey(q.id), piped.code) } catch (e) {}
          }
          code = piped.code
        }
      } catch (e) {}
      var cached = readLcAcceptedCache(q.id)
      if (cached && !cached.empty) code = upsertAcceptedSection(code, cached.code, 'ready')
      else if (cached && cached.empty) code = upsertAcceptedSection(code, null, 'empty')
      else code = upsertAcceptedSection(code, null, 'uncached')
      return code
    }

    function saveCode(id, code) {
      try { localStorage.setItem(draftKey(id), code) } catch (e) {}
      document.getElementById('status').textContent = 'Saved locally'
      return code
    }

    function resetToStarter() {
      var q = currentQuestion()
      if (!q) return
      var starter = starterFor(q)
      var cached = readLcAcceptedCache(q.id)
      var next = cached && !cached.empty
        ? upsertAcceptedSection(starter, cached.code, 'ready')
        : cached && cached.empty
          ? upsertAcceptedSection(starter, null, 'empty')
          : upsertAcceptedSection(starter, null, 'uncached')
      try { localStorage.setItem(draftKey(q.id), next) } catch (e) {}
      if (editorHandle) editorHandle.setDoc(next)
      incrementResetCount(q.id)
      updateResetButtonLabels()
      var status = document.getElementById('status')
      if (status) status.textContent = 'Reset to starter'
    }

    function matches(q, s) {
      if (!s) return true
      s = s.toLowerCase().trim()
      var byId = s.replace(/^#/, '')
      return q.title.toLowerCase().indexOf(s) >= 0 || String(q.id).indexOf(byId) >= 0
    }

    function filterKeyCount(map) {

    function toggleFilterKey(map, key) {

      return next
    }

    function matchesGrindFilters(q, filters) {

      if (!filters.sets[q.set]) return false

      if (pri && !filters.priorities[pri]) return false
      if (filters.pattern !== 'all' && q.pattern !== filters.pattern) return false
      return true
    }

    function filtersCustom() {
      return (

    function applyFilters(opts) {

      filtered = questions.filter(function(q) {

      if (ltsSort) filtered = ltsApply(filtered)
      if (filtered.length && !filtered.some(function(q) { return q.id === selectedId })) {

    function parseGrindSection(section) {
      var m = String(section || '').match(/^(High|Mid|Low) (Easy|Medium|Hard) - (.+)$/)
      if (!m) return { tier: section, pattern: section }
      return { tier: m[1] + ' ' + m[2], pattern: m[3] }
    }

    function priorityFromSection(section) {
      if (!section) return null
      var m = String(section).match(/^(High|Mid|Low) /)
      return m ? m[1] : null
    }

    function grindSummaryCounts(rows) {
      var bySet = { 1: 0, 2: 0, 3: 0 }
      var byDifficulty = {}
      var byPriority = {}
      var byPattern = {}
      rows.forEach(function(q) {
        bySet[q.set] = (bySet[q.set] || 0) + 1
        byDifficulty[q.difficulty] = (byDifficulty[q.difficulty] || 0) + 1
        if (q.pattern) byPattern[q.pattern] = (byPattern[q.pattern] || 0) + 1
        var pri = priorityFromSection(q.section)
        if (pri) byPriority[pri] = (byPriority[pri] || 0) + 1
      })
      return { total: rows.length, bySet: bySet, byDifficulty: byDifficulty, byPriority: byPriority, byPattern: byPattern }
    }

      var parts = []
      var diffs = Object.keys(grindFilters.difficulties)
      var prios = Object.keys(grindFilters.priorities)
      var sets = Object.keys(grindFilters.sets)
      if (diffs.length < 3) parts.push(diffs.join('/') || 'none')
      if (prios.length < 3) parts.push(prios.join('/') || 'none')
      if (sets.length < 3) parts.push(sets.map(function(s) { return 'S' + s }).join('/') || 'none')
      if (grindFilters.pattern !== 'all') parts.push(grindFilters.pattern)
      return parts.length ? parts.join(' · ') : 'All'

    function grindGroupCounts(rows) {

        if (q.section) {
          var parsed = parseGrindSection(q.section)
          var tierKey = q.set + '|' + parsed.tier

    function renderList() {

      }
      list.innerHTML = ''
      var counts = grindGroupCounts(filtered)
      var filterBase = questions.filter(function(q) {
        return matchesGrindFilters(q, {
          difficulties: grindFilters.difficulties,
          priorities: grindFilters.priorities,
          sets: grindFilters.sets,
          pattern: 'all',
        })
      })
      renderCountStrip(filterBase)
      var lastSet = 0
      var lastTier = null
      var lastSection = null
      var ltsSizes = {}
      if (ltsSort) {
        filtered.forEach(function(q) {
          if (!q.section) return
          var k = q.section + '|' + q.set
          ltsSizes[k] = (ltsSizes[k] || 0) + 1
        })
      }
      var lastLtsBand = ''
      var lastLtsSecKey = ''
      var ltsRound = 0
      ltsRoundMap = {}
      ltsLabelMap = {}
      filtered.forEach(function(q) {
        if (ltsSort) {
          if (q.section) {
            var secKey = q.section + '|' + q.set
            var n = ltsSizes[secKey] || 1
            var band = ltsBand(n)
            var priM = q.section.match(/^(High|Mid|Low)/)
            var pri = priM ? priM[1] : ''
            if (band !== lastLtsBand) {
              lastLtsBand = band
              lastLtsSecKey = ''
              appendDivider(list, LTS_BAND_LABEL[band] || band, 0, 'list-divider-tier')
            }
            if (secKey !== lastLtsSecKey) {
              lastLtsSecKey = secKey
              ltsRound++
              ltsRoundMap[secKey] = ltsRound
              var patM = q.section.match(/- (.+)$/)
              var pat = patM ? patM[1] : q.section
              var diffM = q.section.match(/^(?:High|Mid|Low) (Easy|Medium|Hard)/)
              var diff = diffM ? diffM[1] : ''
              var tier = (pri ? pri + ' ' : '') + diff
              var secLabel = 'Round ' + ltsRound + ' | ' + tier + ' S' + q.set + ' (' + n + 'q) ' + pat
              ltsLabelMap[secKey] = secLabel
              appendDivider(list, secLabel, n, 'list-divider-sec')
            }
          }
        } else {
          if (q.set !== lastSet) {
            appendDivider(list, setDividerLabel(q.set), counts.setCounts[q.set] || 0, 'list-divider-set')
            lastSet = q.set
            lastTier = null
            lastSection = null

          if (q.section && q.section !== lastSection) {
            var parsed = parseGrindSection(q.section)
            if (parsed.tier !== lastTier) {
              appendDivider(list, parsed.tier, counts.tierCounts[q.set + '|' + parsed.tier] || 0, 'list-divider-tier')
              lastTier = parsed.tier
            }
            appendDivider(list, parsed.pattern, counts.sectionCounts[q.set + '|' + q.section] || 0, 'list-divider-sec')
            lastSection = q.section

        var btn = document.createElement('button')

        btn.onclick = function() { selectQuestion(q.id) }
        var wrap = document.createElement('div')
        wrap.className = 'q-wrap' + (q.id === selectedId ? ' on' : '')
        wrap.appendChild(btn)
        var lc = document.createElement('a')
        lc.className = 'q-lc'
        lc.href = leetCodeUrl(resolveLeetCodeSlug(q.id, q.slug))
        lc.target = '_blank'
        lc.rel = 'noopener noreferrer'
        lc.title = 'Open on LeetCode'
        lc.setAttribute('aria-label', 'Open ' + q.title + ' on LeetCode')
        lc.textContent = 'LC'
        lc.onclick = function(e) { e.stopPropagation() }
        wrap.appendChild(lc)
        list.appendChild(wrap)
      })
      updateNavUI()
      updateFilterContext()
      var active = list.querySelector('.q-wrap.on')
      if (active && typeof active.scrollIntoView === 'function') {
        requestAnimationFrame(function() {
          active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' })

      if (ct.indexOf('text/html') >= 0 || ct.indexOf('application/json') >= 0 || ct.indexOf('text/plain') >= 0) return false

      return /\.(png|jpe?g|gif|webp|svg)$/i.test(path || '')

                return Promise.all(sample.map(function(p) {
                  return cache.match(p, { ignoreSearch: true }).then(function(hit) {
                    return hit && isUsableImageResponse(hit, p)
                  })
                })).then(function(hits) {
                  var ok = hits.filter(Boolean).length
                  if (ok >= Math.floor(sample.length * 0.9)) {
                    try { localStorage.setItem(DESC_IMG_CACHE_KEY, String(Date.now())) } catch (e) {}
                    return
                  }
                  return cacheDirect()
                })
              })
            })
          }).catch(function() { return cacheDirect() })
        })
        .catch(function() {})
    }

    function cacheOfflineBundle() {
      if (!navigator.onLine || !('caches' in window)) return Promise.resolve()
      return caches.open(SW_CACHE).then(function(cache) {
        var urls = ['/grind-offline.html', '/questions_data_all.json', '/grind_questions.json', '/description-images-manifest.json']
        return Promise.all(urls.map(function(url) {
          return fetch(url, { cache: 'reload' }).then(function(r) {
            if (r.ok) return cache.put(url, r.clone())
          }).catch(function() {})
        }))
      })
    }

    function fillDescriptionEl(el, q) {
      if (!el) return
      if (!q) { el.innerHTML = '<div class="desc-empty">No question selected.</div>'; return }
      var row = descriptions[String(q.id)] || {}
      var html = (q.descriptionHtml || row.description_html || '').trim()
      if (html) {
        el.innerHTML = stripDescScripts(html)
        prefetchDescriptionImages(html)
        return
      }
      var plain = q.description || row.description
      if (plain && String(plain).trim()) {
        el.textContent = plain
        return
      }
      el.innerHTML = '<div class="desc-empty">Description not cached yet.</div>'
    }

    function renderDescription() {
      var q = currentQuestion()
      fillDescriptionEl(document.getElementById('desc-body'), q)
      fillDescriptionEl(document.getElementById('fs-desc-body'), q)
    }

    function setFsDescCollapsed(collapsed) {
      fsDescCollapsed = collapsed
      var pane = document.getElementById('fs-desc-pane')
      var btn = document.getElementById('btn-fs-desc-toggle')
      if (pane) {
        pane.classList.toggle('collapsed', collapsed)
        if (collapsed) pane.classList.remove('kbd-auto-hide')
      }
      if (btn) {
        btn.textContent = collapsed ? 'Show' : 'Hide'
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true')
      }
      if (editorExpanded) requestAnimationFrame(syncEditorHeight)
    }

    function renderEditor() {
      updateMeta()
      renderDescription()
      var q = currentQuestion()
      if (editorHandle) {
        var doc = loadCode(q)
        editorHandle.setDoc(doc)
        if (q) void applyAcceptedToEditor(q, doc)
      } else if (!isMobile() || editorExpanded) initEditor()
      else if (q) {
        void applyAcceptedToEditor(q, loadCode(q))
      }
    }

    function fastTierHtml(abbr) {
      var m = String(abbr || '').match(/^([HML])([EMH])$/)
      if (!m) return abbr
      return m[1] + '<span class="tier-diff-' + m[2].toLowerCase() + '">' + m[2] + '</span>'
    }

    function buildFastGroups() {
      var bucket = {}
      questions.forEach(function(q) {
        var parsed = parseGrindSection(q.section)
        if (!parsed || !parsed.tier || !parsed.pattern) return
        var key = q.set + '|' + parsed.tier + '|' + parsed.pattern
        bucket[key] = (bucket[key] || 0) + 1
      })
      var result = []
      ALL_PRIOS.forEach(function(priority) {
        ALL_SETS.forEach(function(setNum) {
          ALL_DIFFS.forEach(function(diff) {
            var tier = priority + ' ' + diff
            FAST_PATTERN_ORDER.forEach(function(pattern) {
              var count = bucket[setNum + '|' + tier + '|' + pattern] || 0
              if (!count) return
              result.push({
                priority: priority,
                set: setNum,
                tier: tier,
                difficulty: diff,
                pattern: pattern,
                count: count,
                tierAbbr: FAST_TIER_ABBREV[tier] || tier,
                patAbbr: FAST_PATTERN_ABBREV[pattern] || pattern
              })
            })
          })
        })
      })
      return result
    }

    function fastGroupActive(group) {
      return (
        grindFilters.pattern === group.pattern &&
        filterKeyCount(grindFilters.sets) === 1 &&
        !!grindFilters.sets[group.set] &&
        filterKeyCount(grindFilters.priorities) === 1 &&
        !!grindFilters.priorities[group.priority] &&
        filterKeyCount(grindFilters.difficulties) === 1 &&
        !!grindFilters.difficulties[group.difficulty]
      )
    }

    function selectFastGroup(group) {
      grindFilters = {
        difficulties: mapFromKeys([group.difficulty]),
        priorities: mapFromKeys([group.priority]),
        sets: mapFromKeys([group.set]),
        pattern: group.pattern
      }
      var search = document.getElementById('search')
      if (search) search.value = ''
      applyFilters()
      setFastListOpen(false)
    }

    function renderFastLists() {
      var panel = document.getElementById('fast-lists-panel')
      var scroll = document.getElementById('fast-lists-scroll')
      var total = document.getElementById('fast-lists-total')
      if (!panel || !scroll) return
      var groups = buildFastGroups()
      if (total) total.textContent = String(groups.length)
      scroll.innerHTML = ''
      ALL_PRIOS.forEach(function(priority) {
        var items = groups.filter(function(g) { return g.priority === priority })
        var section = document.createElement('div')
        section.className = 'fast-lists-section'
        var label = document.createElement('div')
        label.className = 'fast-lists-section-label'
        label.style.color = FAST_PRIO_COLOR[priority]
        label.style.background = FAST_PRIO_BG[priority]
        label.textContent = priority + ' · ' + items.length + ' lists'
        section.appendChild(label)
        var chips = document.createElement('div')
        chips.className = 'fast-lists-chips'
        items.forEach(function(group) {
          var btn = document.createElement('button')
          var active = fastGroupActive(group)
          btn.type = 'button'
          btn.className = 'fast-chip' + (active ? ' on' : '')
          btn.title = 'Set ' + group.set + ' · ' + group.pattern + ' · ' + group.tier
          btn.innerHTML =
            '<span class="fast-chip-set" style="color:' + FAST_SET_COLOR[group.set] + '">S' + group.set + '</span> ' +
            group.patAbbr + ' · ' + fastTierHtml(group.tierAbbr) +
            '<span class="fast-chip-count">· ' + group.count + 'q</span>'
          if (active) {
            btn.style.borderColor = FAST_SET_COLOR[group.set]
            btn.style.color = FAST_SET_COLOR[group.set]
          }
          btn.onclick = function() { selectFastGroup(group) }
          chips.appendChild(btn)
        })
        section.appendChild(chips)
        scroll.appendChild(section)
      })
    }

    function setListOpen(open) {
      listOpen = open
      var wrap = document.getElementById('list-wrap')
      var backdrop = document.getElementById('list-backdrop')
      var btn = document.getElementById('btn-list')
      if (wrap) wrap.classList.toggle('open', open || fastListOpen)
      if (backdrop) backdrop.classList.toggle('open', open || fastListOpen)
      if (btn) btn.textContent = open ? 'Hide' : 'List'
    }

    function setFastListOpen(open) {
      fastListOpen = open
      if (open) listOpen = false
      var listHead = document.getElementById('list-head')
      var list = document.getElementById('list')
      var panel = document.getElementById('fast-lists-panel')
      var wrap = document.getElementById('list-wrap')
      var backdrop = document.getElementById('list-backdrop')
      var fastBtn = document.getElementById('btn-fast')
      var listBtn = document.getElementById('btn-list')
      if (listHead) listHead.style.display = open ? 'none' : ''
      if (list) list.style.display = open ? 'none' : ''
      if (panel) panel.classList.toggle('open', open)
      if (wrap) wrap.classList.toggle('open', open || listOpen)
      if (backdrop) backdrop.classList.toggle('open', open || listOpen)
      if (fastBtn) fastBtn.classList.toggle('on', open)
      if (listBtn) listBtn.textContent = listOpen ? 'Hide' : 'List'
      if (open) renderFastLists()
    }

    function setEditorExpanded(open) {
      if (open === editorExpanded) return
      var q = currentQuestion()
      if (!q) return
      editorExpanded = open
      var portal = document.getElementById('fs-portal')
      if (open) {
        setListOpen(false)
        setFsDescCollapsed(false)
        editorHostId = 'editor-host-fs'
        portal.classList.add('open')
        document.body.classList.add('fs-open')
        renderDescription()
        initEditor()
        updateMeta()
        layoutFullscreenEditor()
      } else {
        editorHostId = 'editor-host'
        portal.classList.remove('open')
        portal.classList.remove('kbd-open')
        var descPane = document.getElementById('fs-desc-pane')
        if (descPane) descPane.classList.remove('kbd-auto-hide')
        document.body.classList.remove('fs-open')
        if (editorHandle) {
          editorHandle.destroy()
          editorHandle = null
        }
        resetAppLayout()
        initEditor()
        renderDescription()
      }
    }

    function layoutFullscreenEditor() {
      var portal = document.getElementById('fs-portal')
      var vv = window.visualViewport
      if (!portal || !portal.classList.contains('open')) return
      portal.style.position = 'fixed'
      portal.style.left = '0'
      portal.style.right = '0'
      portal.style.top = (vv ? vv.offsetTop : 0) + 'px'
      portal.style.bottom = 'auto'
      var h = vv ? vv.height : window.innerHeight
      portal.style.height = h + 'px'
      portal.style.maxHeight = h + 'px'
      var kbdLikely = vv && window.innerHeight - vv.height > 120
      portal.classList.toggle('kbd-open', !!kbdLikely)
      var descPane = document.getElementById('fs-desc-pane')
      if (descPane) descPane.classList.toggle('kbd-auto-hide', !!kbdLikely)
      var fsDescBtn = document.getElementById('btn-fs-desc-toggle')
      if (fsDescBtn && kbdLikely) {
        fsDescBtn.textContent = 'Show'
        fsDescBtn.setAttribute('aria-expanded', 'false')
      } else if (fsDescBtn && !fsDescCollapsed) {
        fsDescBtn.textContent = 'Hide'
        fsDescBtn.setAttribute('aria-expanded', 'true')
      }
      if (kbdLikely) window.scrollTo(0, 0)
      syncEditorHeight()
    }

    function selectQuestion(id, closeList) {
      if (closeList === undefined) closeList = true
      selectedId = id
      writeLastQuestionId(id)
      renderList()
      renderEditor()
      if (closeList) setListOpen(false)
      updateConnectivityUI()
      try { history.replaceState(null, '', '?id=' + id) } catch (e) {}
    }

    var descCollapsed = false

    function isMobile() {
      return window.matchMedia('(max-width: 767px)').matches
    }

    function setDescCollapsed(collapsed) {
      descCollapsed = collapsed
      var card = document.getElementById('desc-card')
      var btn = document.getElementById('btn-desc-toggle')
      if (card) card.classList.toggle('collapsed', collapsed)
      if (btn) {
        btn.textContent = collapsed ? 'Show' : 'Hide'
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true')
      }
    }

    function bindVisualViewport() {
      var vv = window.visualViewport
      if (!vv) return
      function update() {
        if (!isMobile()) {
          resetAppLayout()
          return
        }
        if (editorExpanded) {
          layoutFullscreenEditor()
        } else {
          resetAppLayout()
        }
      }
      vv.addEventListener('resize', update)
      vv.addEventListener('scroll', function() {
        if (editorExpanded) window.scrollTo(0, 0)
      })
      window.addEventListener('resize', update)
      window.addEventListener('pageshow', resetAppLayout)
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (!editorExpanded) resetAppLayout()
          else layoutFullscreenEditor()
        }
      })
      update()
    }

      document.getElementById('list-backdrop').onclick = function() {

      document.getElementById('btn-list').onclick = function() {

        setListOpen(!listOpen)
      }
      document.getElementById('btn-meta-list').onclick = function() {
        setFastListOpen(false)
        setListOpen(!listOpen)
      }
      document.getElementById('btn-fast').onclick = function() {
        setFastListOpen(!fastListOpen)
      }
      document.getElementById('btn-fast-close').onclick = function() {
        setFastListOpen(false)
      }
      document.getElementById('btn-prev').onclick = function() { goNav(-1) }
      document.getElementById('btn-next').onclick = function() { goNav(1) }
      var tabDesc = document.getElementById('tab-desc')
      var tabCode = document.getElementById('tab-code')
      if (tabCode) tabCode.onclick = function() { setEditorExpanded(true) }
      if (tabDesc) tabDesc.onclick = function() { /* already on desc */ }
      document.getElementById('btn-reset').onclick = function() { resetToStarter() }
      var copyBtn = document.getElementById('btn-copy')
      if (copyBtn) copyBtn.onclick = function() { copyEditorCode(copyBtn) }
      var btnUndo = document.getElementById('btn-undo')
      if (btnUndo) btnUndo.onclick = function() { if (editorHandle) editorHandle.undo() }
      var btnRedo = document.getElementById('btn-redo')
      if (btnRedo) btnRedo.onclick = function() { if (editorHandle) editorHandle.redo() }
      document.getElementById('btn-fs-prev').onclick = function() { goNav(-1) }
      document.getElementById('btn-fs-next').onclick = function() { goNav(1) }
      document.getElementById('btn-fs-close').onclick = function() { setEditorExpanded(false) }
      var fsDescToggle = document.getElementById('btn-fs-desc-toggle')
      if (fsDescToggle) {
        fsDescToggle.onclick = function() { setFsDescCollapsed(!fsDescCollapsed) }
      }
      document.getElementById('fs-btn-py').onclick = function() { setLang('python3') }
      document.getElementById('fs-btn-cpp').onclick = function() { setLang('cpp') }

      var sp = new URLSearchParams(location.search)
      var fromUrl = parseInt(sp.get('id') || '0', 10)
      var savedId = readLastQuestionId()
      filtered = questions.slice()
      selectedId = fromUrl && questions.some(function(q) { return q.id === fromUrl })
        ? fromUrl
        : savedId && questions.some(function(q) { return q.id === savedId })
          ? savedId
          : questions[0].id
      writeLastQuestionId(selectedId)
      editorHostId = 'editor-host'
      applyFilters({ skipEditor: true })
      initEditor()
      updateMeta()
      updateHeaderSub()
      renderDescription()
      updateNavUI()
      bindVisualViewport()

    function setLang(next) {
      if (next === lang) return
      lang = next
      syncLangButtons()
      var q = currentQuestion()
      if (editorHandle && q) {
        editorHandle.setLang(next)
        var doc = loadCode(q)
        editorHandle.setDoc(doc)
        void applyAcceptedToEditor(q, doc)
      }
      if (navigator.onLine) void prefetchAcceptedForOffline()
    }

    document.getElementById('btn-py').onclick = function() { setLang('python3') }
    document.getElementById('btn-cpp').onclick = function() { setLang('cpp') }
    document.getElementById('btn-reset-fs').onclick = function() { resetToStarter() }
    document.getElementById('btn-copy-fs').onclick = function() {
      copyEditorCode(document.getElementById('btn-copy-fs'))
    }
    var btnUndoFs = document.getElementById('btn-undo-fs')
    if (btnUndoFs) btnUndoFs.onclick = function() { if (editorHandle) editorHandle.undo() }
    var btnRedoFs = document.getElementById('btn-redo-fs')
    if (btnRedoFs) btnRedoFs.onclick = function() { if (editorHandle) editorHandle.redo() }
    document.getElementById('search').addEventListener('input', function(e) {
      applyFilters()
      if (e.target.value.trim() && window.matchMedia('(max-width: 767px)').matches) setListOpen(true)
    })

    function fetchCached(url) {
      if (!('caches' in window)) return Promise.reject(new Error('no cache'))
      var names = [SW_CACHE, 'lm-v30', 'lm-v29', 'lm-v28', 'lm-v16', 'lm-v15', 'lm-v14', 'lm-v13']
      var i = 0
      function tryNext() {
        if (i >= names.length) return Promise.reject(new Error('missing'))
        var name = names[i++]
        return caches.open(name).then(function(cache) {
          return cache.match(url, { ignoreSearch: true })
        }).then(function(r) {
          if (r) return r
          return tryNext()
        })
      }
      return caches.match(url, { ignoreSearch: true }).then(function(r) {
        return r || tryNext()
      })
    }

    function loadEditorScript() {
      if (window.GrindOfflineEditor) return Promise.resolve()
      return new Promise(function(resolve, reject) {
        var done = false
        function finish() { if (!done) { done = true; resolve() } }
        function fail() {
          fetchCached('/grind-offline-editor.js').then(function(r) { return r.text() }).then(function(code) {
            var inline = document.createElement('script')
            inline.textContent = code
            document.head.appendChild(inline)
            finish()
          }).catch(reject)
        }
        var s = document.createElement('script')
        s.src = '/grind-offline-editor.js'
        s.onload = finish
        s.onerror = fail
        document.head.appendChild(s)
      })
    }

    function loadQuestions() {
      return fetch('/grind_questions.json', { cache: 'no-store' })
        .then(function(r) {
          if (r.ok) return r.json()
          throw new Error('network')
        })
        .catch(function() {
          return fetchCached('/grind_questions.json').then(function(r) { return r.json() })
        })
    }

    function loadDescriptions() {
      return fetch('/questions_data_all.json', { cache: 'no-store' })
        .then(function(r) {
          if (r.ok) return r.json()
          throw new Error('network')
        })
        .catch(function() {
          return fetchCached('/questions_data_all.json').then(function(r) { return r.json() })
        })
    }

    loadEditorScript()
      .then(function() {
        return loadQuestions()
      })
      .then(function(qs) {
        questions = qs
        return loadDescriptions().catch(function() { return {} })
      })
      .then(function(desc) {
        descriptions = desc || {}
        migrateAllDrafts()
        buildUI()
        updateConnectivityUI()
        var status = document.getElementById('status')
        if (status) {
          status.textContent = navigator.onLine
            ? questions.length + ' questions · ' + OFFLINE_VERSION
            : 'Offline · ' + OFFLINE_VERSION + ' · saved locally'
        }
        return cacheOfflineBundle().then(function() {
          return cacheAllDescriptionImages()
        })
      })
      .catch(function() {
        document.getElementById('body').innerHTML =
          '<div class="err">Could not load offline Grind. Open the app online once and wait for the download to finish.</div>'
      })
  </script>
