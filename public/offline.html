<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — LeetMastery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 1.25rem;
    }
    .card {
      background: white;
      border-radius: 1.25rem;
      padding: 2rem 1.75rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon {
      width: 52px; height: 52px;
      background: #eef2ff;
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.6rem;
    }
    h1 { font-size: 1.15rem; font-weight: 700; color: #111827; margin-bottom: 0.4rem; }
    p  { font-size: 0.85rem; color: #6b7280; line-height: 1.6; margin-bottom: 1.25rem; }
    .btn-primary {
      background: #4f46e5; color: white;
      border: none; border-radius: 0.75rem;
      padding: 0.65rem 1.25rem;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; width: 100%;
      transition: background 0.15s;
      text-decoration: none; display: block;
      margin-bottom: 0.5rem;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-grind {
      background: #059669;
    }
    .btn-grind:hover { background: #047857; }
    .btn-secondary {
      background: #f3f4f6; color: #374151;
    }
    .btn-secondary:hover { background: #e5e7eb; }

    .nav-card {
      background: white;
      border-radius: 1.25rem;
      padding: 1.25rem 1.75rem;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .nav-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 0.75rem;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .nav-link {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      background: #f3f4f6;
      border-radius: 0.625rem;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      color: #374151;
    }
    .nav-link.grind { background: #ecfdf5; color: #065f46; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128225;</div>
    <h1>You're offline</h1>
    <p>These pages still work without internet:</p>
    <a class="btn-primary btn-grind" href="/grind">Grind - write code offline</a>
    <a class="btn-primary" href="/">Questions</a>
    <a class="btn-primary btn-secondary" onclick="history.length > 1 ? history.back() : location.href='/'" href="/">Go back</a>
  </div>

  <div class="nav-card">
    <div class="nav-label">More offline pages</div>
    <div class="nav-grid">
      <a class="nav-link grind" href="/grind">Grind</a>
      <a class="nav-link" href="/">Questions</a>
      <a class="nav-link" href="/flashcards">Flashcards</a>
      <a class="nav-link" href="/daily">Daily</a>
      <a class="nav-link" href="/cycles">Cycles</a>
      <a class="nav-link" href="/behavioral">Behavioral</a>
      <a class="nav-link" href="/system-design">System Design</a>
      <a class="nav-link" href="/dsa">DSA</a>
      <a class="nav-link" href="/gems">Gems</a>
      <a class="nav-link" href="/patterns">Patterns</a>
      <a class="nav-link" href="/quick-review">Quick Review</a>
      <a class="nav-link" href="/about">About</a>
    </div>
  </div>
</body>
</html>
